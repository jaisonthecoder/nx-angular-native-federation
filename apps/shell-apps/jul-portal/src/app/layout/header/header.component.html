<header class="app-header w-100">
  <div class="header-left">
    <button class="menu-toggle" (click)="onMenuToggle()" aria-label="Toggle menu">
      <img src="assets/global-icons/global-menu-icon.svg" alt="Menu" class="menu-icon" />
    </button>

    <div class="service--title">
      <span class="logo-text">Licensing Services</span>
    </div>
  </div>

  <div class="header-center">
  </div>

  <div class="header-right">
    <!-- Language Selector -->
    <div class="language-selector">
      <button class="icon-btn" aria-label="Change language">
        <span class="language-text">Português</span>
      </button>
    </div>

    <!-- Theme Toggle -->
    <button class="icon-btn theme-toggle" aria-label="Toggle theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="12" cy="12" r="5" stroke-width="2"/>
        <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Notifications -->
    <div class="notification-wrapper">
      <button class="icon-btn notification-btn" (click)="toggleNotifications()" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="notification-badge" *ngIf="notificationCount > 0">{{ notificationCount }}</span>
      </button>

      <div class="dropdown-menu notification-menu" *ngIf="showNotifications">
        <div class="dropdown-header">
          <h3>Notifications</h3>
          <span class="badge">{{ notificationCount }}</span>
        </div>
        <div class="notification-list">
          <div class="notification-item">
            <div class="notification-icon success">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20 6L9 17l-5-5" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="notification-content">
              <p class="notification-title">Certificate Approved</p>
              <p class="notification-text">Your DUP certificate has been approved</p>
              <span class="notification-time">2 hours ago</span>
            </div>
          </div>
        </div>
        <div class="dropdown-footer">
          <a href="#" class="view-all-link">View all notifications</a>
        </div>
      </div>
    </div>

    <!-- User Menu -->
    <div class="user-wrapper">
      <button class="user-menu-btn" (click)="toggleUserMenu()" aria-label="User menu">
        <div class="user-avatar">
          <img src="assets/default-avatar.png" alt="User avatar" />
        </div>
        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">{{ userRole }}</span>
        </div>
        <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="m6 9 6 6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="dropdown-menu user-dropdown" *ngIf="showUserMenu">
        <div class="dropdown-header">
          <div class="user-avatar-large">
            <img src="assets/default-avatar.png" alt="User avatar" />
          </div>
          <div>
            <p class="user-name-large">{{ userName }}</p>
            <p class="user-email">user@example.com</p>
          </div>
        </div>
        <div class="dropdown-divider"></div>
        <a href="#" class="dropdown-item" (click)="onProfile()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="7" r="4" stroke-width="2"/>
          </svg>
          <span>Profile</span>
        </a>
        <a href="#" class="dropdown-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="3" stroke-width="2"/>
            <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m7.08 7.08l4.24 4.24" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Settings</span>
        </a>
        <div class="dropdown-divider"></div>
        <a href="#" class="dropdown-item logout" (click)="onLogout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Logout</span>
        </a>
      </div>
    </div>
  </div>
</header>
